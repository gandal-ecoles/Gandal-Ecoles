.x{background:none;color:var(--rd);border:0;padding:4px 10px;cursor:pointer}

.ic{display:block;font-size:1.6rem}

td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:start}

.chk{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin-top:8px;font-weight:600}

.photo img{width:64px;height:80px;object-fit:cover;border:1px solid var(--bd);border-radius:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--ink);display:none;padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}

#sheet{position:fixed;left:0;right:0;bottom:calc(61px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:14px 14px 0 0;border-top:5px solid var(--ac);z-index:25;max-height:70vh;overflow:auto;display:none}
#sheet.show,#sheet-bg.show{display:block}
#sheet .sh{padding:12px 18px;font-weight:700;color:var(--ink2)}

#dlg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:99;padding:16px}
#dlg .box{background:var(--card);color:var(--tx);border-radius:12px;max-width:360px;width:100%;overflow:hidden}
#dlg .ttl{background:var(--ink);color:#fff;padding:10px 14px;font-weight:700}
#dlg p{padding:12px 14px;margin:0;white-space:pre-line}
#dlg input{margin:0 14px 10px;width:calc(100% - 28px)}
#dlg .acts{display:flex;gap:8px;justify-content:flex-end;padding:0 14px 14px}
#dlg .acts button{padding:8px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
#dlg .acts .btn{width:auto;margin:0;min-height:0;background:var(--ink);color:#fff;border:2px solid var(--ink)}
@media print{header,nav,.noprint{display:none!important}.card{border:0}}

function homeView(){const s=SC(),yrs=D.years.map(y=>y.name).sort().reverse(),locked=!!(s.mat_prefix&&D.students.length);
 return `<div class="card"><h2>${Z('Années scolaires','School years','السنوات الدراسية')}</h2><div class="years">${yrs.map(y=>`<span>${esc(y)}</span>`).join('')||`<span class="mu">${t('none')}</span>`}</div><label for="yn">${Z('Ajouter une année (ex. 2026-2027)','Add a year (e.g. 2026-2027)','إضافة سنة (مثال 2026-2027)')}</label><input id="yn" placeholder="2026-2027"><button class="btn alt" onclick="addYear()">${t('add')}</button></div>
<div class="card"><h2>${Z('Contact de l’école','School contact','بيانات المدرسة')}</h2>${fl('sn',t('sname'),s.name)}${fl('ad',Z('Adresse','Address','العنوان'),s.address)}${tl('ph',Z('Téléphone','Phone','الهاتف'),s.phone)}${fl('em','Email',s.email,'type="email"')}${fl('cu',t('curr'),s.currency)}<button class="btn alt" onclick="saveProfile()">${t('save')}</button></div>
<div class="card"><h2>${Z('Logo de l’école','School logo','شعار المدرسة')}</h2>${s.logo?`<img src="${s.logo}" alt="" style="max-width:120px;max-height:120px;display:block;margin-bottom:8px">`:`<p class="hint" style="margin-top:0">${Z('Aucun logo','No logo','لا يوجد شعار')}</p>`}<input type="file" id="lf" accept="image/*" class="hidden" onchange="pickLogo(this)"><button class="btn alt" onclick="$('lf').click()">${s.logo?Z('Changer le logo','Change logo','تغيير الشعار'):Z('Ajouter le logo','Add logo','إضافة شعار')}</button>${s.logo?`<button class="btn alt" onclick="run(sb.from('schools').update({logo:null}).eq('id',user.sid))">${Z('Supprimer le logo','Remove logo','حذف الشعار')}</button>`:''}</div>
<div class="card"><h2>${Z('Matricule des élèves','Student ID','رقم تسجيل التلاميذ')}</h2><p class="hint" style="margin-top:0">${Z('Lettres','Letters','الحروف')} : <b>${esc(s.mat_prefix||Z('non définies','not set','غير محددة'))}</b>${s.mat_prefix?' · '+Z('Exemple','Example','مثال')+' : '+esc(matFor(yrs[0]||today(),1)):''}</p>${locked?`<p class="hint">${Z('Les lettres ne peuvent plus être changées : des élèves sont déjà enregistrés.','Letters are locked: students already exist.','لا يمكن تغيير الحروف: يوجد تلاميذ مسجلون.')}</p>`:`<label for="pf">${Z('2 ou 3 lettres (ex. HD)','2 or 3 letters (e.g. HD)','حرفان أو ثلاثة (مثال HD)')}</label><input id="pf" value="${esc(s.mat_prefix||'')}" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3)"><button class="btn alt" onclick="savePrefix()">${t('save')}</button>`}<p class="hint">${Z('Format : lettres + 2 derniers chiffres de l’année + numéro (ex. HD26000001).','Format: letters + last 2 digits of the year + number (e.g. HD26000001).','الصيغة: حروف + آخر رقمين من السنة + رقم (مثال HD26000001).')}</p></div>
<div class="card"><h2>${t('settings')}</h2><button class="btn alt" onclick="go('settings')">${t('settings')} ›</button></div>`}
async function addYear(){const m=$('yn').value.trim().match(/^(\d{4})\s*[-\/–]\s*(\d{4})$/);
 if(!m||+m[2]!=+m[1]+1)return note(Z('Format attendu : 2026-2027','Expected format: 2026-2027','الصيغة المطلوبة: 2026-2027'));
 const name=m[1]+'-'+m[2];if(D.years.some(y=>y.name==name))return note(Z('Cette année existe déjà.','This year already exists.','هذه السنة موجودة.'));
 await ins('school_years',{name})}
async function saveProfile(){const n=$('sn').value.trim();if(!n)return note(t('sname'));
 const r=await run(sb.from('schools').update({name:n,address:$('ad').value.trim(),phone:$('ph').value.trim(),email:$('em').value.trim(),currency:$('cu').value.trim()}).eq('id',user.sid));if(!r.error){user.name=n;render();note(t('saved'))}}
async function savePrefix(){const v=$('pf').value.trim().toUpperCase();if(!/^[A-Z]{2,3}$/.test(v))return note(Z('Saisissez 2 ou 3 lettres (A à Z).','Enter 2 or 3 letters (A to Z).','أدخل حرفين أو ثلاثة (A-Z).'));
 const r=await run(sb.from('schools').update({mat_prefix:v}).eq('id',user.sid));if(!r.error)note(Z('Lettres enregistrées : ','Letters saved: ','تم حفظ الحروف: ')+v+' · '+Z('Exemple','Example','مثال')+' '+matFor(today(),1))}
function pickLogo(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;img(f,240,'image/png',1,d=>{if(!d)return note(Z('Image illisible','Unreadable image','صورة غير صالحة'));run(sb.from('schools').update({logo:d}).eq('id',user.sid))})}
/* ---- levels, classes, subjects ---- */
function list(k,f){const a=D[k];return a.length?a.map(x=>`<div class="li"><span>${f(x)}</span><button class="x" onclick="del('${k}','${x.id}')">✕</button></div>`).join(''):`<p class="mu">${t('none')}</p>`}
function addLevel(){const n=$('n').value.trim();if(n)ins('levels',{name:n})}
function addClass(){const n=$('n').value.trim(),l=$('lv').value;if(!n||!l)return;if(D.classes.some(c=>c.level_id==l&&c.name.toLowerCase()==n.toLowerCase()))return note(Z('Cette classe existe déjà pour ce niveau.','This class already exists for this level.','هذا القسم موجود في هذه المرحلة.'));ins('classes',{name:n,level_id:l,active:true})}
async function togCls(id){const c=D.classes.find(x=>x.id==id),a=c.active!==false;if(!await ask(`${a?Z('Désactiver','Deactivate','تعطيل'):Z('Activer','Activate','تفعيل')} « ${c.name} » ?`))return;run(sb.from('classes').update({active:!a}).eq('id',id))}
function addSubj(){const n=$('n').value.trim(),c=$('c').value;if(n&&c)ins('subjects',{name:n,class_id:c,coef:+$('f').value||1})}
const classSel=()=>`<select id="c">${opts(D.classes.filter(c=>c.active!==false).map(cl))}</select>`;
function levelsView(){return `<div class="card"><div class="row"><input id="n" placeholder="${t('name')}"><button class="btn" onclick="addLevel()">${t('add')}</button></div>${list('levels',x=>esc(x.name)+` <span class="mu">(${D.classes.filter(c=>c.level_id==x.id).length} ${t('classes').toLowerCase()})</span>`)}</div>`}
function classesView(){return `<div class="card"><h2>${Z('Nouvelle classe','New class','قسم جديد')}</h2><label>${t('level')}</label><select id="lv"><option value="">${t('choose')}</option>${D.levels.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select><label>${t('name')}</label><input id="n" autocomplete="off"><button class="btn" onclick="addClass()">${t('add')}</button></div><div class="card"><h2>${t('classes')} (${D.classes.length})</h2>${D.classes.map(c=>{const a=c.active!==false;return `<div class="item"><div class="tx">${esc(c.name)}<span class="tag ${a?'on':'off'}">${a?Z('Active','Active','نشط'):Z('Inactive','Inactive','غير نشط')}</span><small>${esc(nm(D.levels,c.level_id))}</small></div><div class="btns"><button class="btn alt small" onclick="togCls('${c.id}')">${a?Z('Désactiver','Deactivate','تعطيل'):Z('Activer','Activate','تفعيل')}</button><button class="x" onclick="del('classes','${c.id}')">✕</button></div></div>`}).join('')||`<p class="mu">${t('none')}</p>`}</div>`}
function subjectsView(){const C=D.classes.map(cl);return `<div class="card"><div class="row">${classSel()}<input id="n" placeholder="${t('name')}"><input id="f" type="number" min="1" placeholder="${t('coef')}"></div><button class="btn" onclick="addSubj()">${t('add')}</button>${list('subjects',x=>`${esc(x.name)} <span class="mu">(${esc(nm(C,x.class_id))} · ×${x.coef})</span>`)}</div>`}
/* ---- grading structure (per level) ---- */
let GS=null;
const numv=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?null:n};
const fmt=n=>n==null?'-':String(Math.round(n*100)/100).replace('.',lang=='en'?'.':',');
const isSP=ty=>ty=='semestre'||ty=='trimestre';
const tlab=k=>({semestre:Z('Semestre','Semester','سداسي'),trimestre:Z('Trimestre','Trimester','ثلاثي'),evaluation:Z('Évaluation','Evaluation','تقويم'),test:Z('Test','Test','اختبار')})[k];
const pNm=(ty,i)=>ty=='semestre'?Z(`${i==1?'1er':i+'e'} semestre`,`Semester ${i}`,`السداسي ${i}`):Z(`${i==1?'1er':i+'e'} trimestre`,`Trimester ${i}`,`الثلاثي ${i}`);
const tNm=(ty,j)=>(ty=='test'?Z('Test ','Test ','اختبار '):Z('Éval ','Eval ','تقويم '))+j;
const dsp=n=>String(Math.round(n*100)/100).replace('.',lang=='en'?'.':',');
const mDef=(mn,mx)=>{const L=[Z('Excellent','Excellent','ممتاز'),Z('Très bien','Very good','جيد جدًا'),Z('Bien','Good','حسن'),Z('Assez bien','Fairly good','قريب من الحسن'),Z('Passable','Pass','مقبول'),Z('Insuffisant','Insufficient','ضعيف')],P=[90,80,70,60,50,0],f=p=>Math.round((mn+p/100*(mx-mn))*100)/100;return L.map((l,i)=>({label:l,from:dsp(f(P[i])),to:dsp(i==0?mx:f(P[i-1])-0.01)}))};
function mentRows(g){const mn=+g.min_score,mx=+g.max_score,a=g.mentions||[];if(a.length&&a[0].from==null){const o=a.slice().sort((x,y)=>x.pct-y.pct);return o.map((m,i)=>({label:m.label,from:mn+m.pct/100*(mx-mn),to:i<o.length-1?mn+o[i+1].pct/100*(mx-mn)-0.01:mx})).reverse()}return a.map(m=>({label:m.label,from:+m.from,to:+m.to}))}
const passOf=g=>g.pass_score!=null?+g.pass_score:(+g.min_score)+(+g.pass_pct||50)/100*((+g.max_score)-(+g.min_score));
const mkTests=(ty,n,old)=>Array.from({length:n},(_,j)=>old&&old[j]!=null?old[j]:tNm(ty,j+1));
function gNew(lv,ty,keep){const sp=isSP(ty),np=sp?(ty=='semestre'?2:3):1;
 return {lv,type:ty,periods:Array.from({length:np},(_,i)=>({name:sp?pNm(ty,i+1):'',tests:mkTests(ty,4)})),annual:np>=2?'avg_periods':'avg_all',min:keep?keep.min:'0',max:keep?keep.max:'20',pass:keep?keep.pass:'10',mentions:keep?keep.mentions:mDef(0,20)}}
function gFrom(g){return {lv:g.level_id,type:g.type,periods:g.periods.map(p=>({name:p.name,tests:p.tests.slice()})),annual:g.annual,min:dsp(+g.min_score),max:dsp(+g.max_score),pass:dsp(passOf(g)),mentions:mentRows(g).map(m=>({label:m.label,from:dsp(m.from),to:dsp(m.to)}))}}
function grab(){if(!GS||!GS.type||!$('gf'))return;const v=id=>{const e=$(id);return e?e.value:null};
 GS.periods.forEach((p,i)=>{const pn=v('g-pn'+i);if(pn!=null)p.name=pn;p.tests=p.tests.map((n,j)=>{const z=v(`g-t${i}_${j}`);return z==null?n:z})});
 const an=v('g-an');if(an)GS.annual=an;['min','max','pass'].forEach(k=>{const z=v('g-'+k);if(z!=null)GS[k]=z});
 GS.mentions=GS.mentions.map((m,r)=>{const l=v('g-ml'+r),a=v('g-mf'+r),b=v('g-mt'+r);return {label:l==null?m.label:l,from:a==null?m.from:a,to:b==null?m.to:b}})}
function gLevel(v){const g=D.grading.find(x=>x.level_id==v);GS=v?(g?gFrom(g):{lv:v,type:''}):null;$('g-lv').value=v||'';drawG()}
function gType(v){grab();if(!v){GS={lv:GS.lv,type:''};return drawG()}if(GS.type==v)return;GS=gNew(GS.lv,v,GS.min!==undefined?GS:null);drawG()}
function gNp(n){grab();const old=GS.periods;GS.periods=Array.from({length:n},(_,i)=>old[i]||{name:pNm(GS.type,i+1),tests:mkTests(GS.type,4)});if(n<2&&GS.annual=='avg_periods')GS.annual='avg_all';drawG()}
function gCnt(i,n){grab();GS.periods[i].tests=mkTests(GS.type,n,GS.periods[i].tests);drawG()}
function gAddM(){grab();GS.mentions.push({label:'',from:'',to:''});drawG()}
function gMReset(){grab();const a=numv(GS.min),b=numv(GS.max);if(a==null||b==null||b<=a)return note(Z('Saisissez d’abord un minimum et un maximum valides.','Enter a valid minimum and maximum first.','أدخل حدًا أدنى وأقصى صالحين أولاً.'));GS.mentions=mDef(a,b);drawG()}
function gDelM(r){grab();GS.mentions.splice(r,1);drawG()}
const rng=(a,b,v)=>Array.from({length:b-a+1},(_,i)=>`<option ${a+i==v?'selected':''}>${a+i}</option>`).join('');
function drawG(){const f=$('gf');if(!f)return;if(!GS||!GS.lv){f.innerHTML='';return}
 let h=`<label for="g-type">${Z('Type','Type','النوع')}</label><select id="g-type" onchange="gType(this.value)"><option value="">—</option>${['semestre','trimestre','evaluation','test'].map(k=>`<option value="${k}" ${GS.type==k?'selected':''}>${tlab(k)}</option>`).join('')}</select>`;
 if(!GS.type){f.innerHTML=h;return}
 const sp=isSP(GS.type),np=GS.periods.length;
 if(sp)h+=`<label for="g-np">${GS.type=='semestre'?Z('Nombre de semestres','Number of semesters','عدد السداسيات'):Z('Nombre de trimestres','Number of trimesters','عدد الثلاثيات')}</label><select id="g-np" onchange="gNp(+this.value)">${rng(1,4,np)}</select>`;
 GS.periods.forEach((p,i)=>{
  h+=`<div class="sub">${sp?(i+1)+'. '+esc(p.name||pNm(GS.type,i+1)):tlab(GS.type)}</div>`;
  if(sp)h+=fl('g-pn'+i,Z('Nom de la période','Period name','اسم الفترة'),p.name);
  h+=`<label>${sp?Z('Nombre de tests','Number of tests','عدد الاختبارات'):(GS.type=='test'?Z('Nombre de tests dans l’année','Number of tests in the year','عدد الاختبارات في السنة'):Z('Nombre d’évaluations dans l’année','Number of evaluations in the year','عدد التقويمات في السنة'))}</label><select onchange="gCnt(${i},+this.value)">${rng(1,12,p.tests.length)}</select>`;
  p.tests.forEach((n,j)=>{h+=fl(`g-t${i}_${j}`,(GS.type=='test'?Z('Test','Test','اختبار'):Z('Éval','Eval','تقويم'))+' '+(j+1),n)})});
 h+=`<div class="sub">${Z('Note annuelle','Annual grade','النقطة السنوية')}</div><select id="g-an"><option value="avg_all" ${GS.annual=='avg_all'?'selected':''}>${Z('Moyenne de toutes les évaluations','Average of all evaluations','معدل كل التقويمات')}</option>${sp&&np>=2?`<option value="avg_periods" ${GS.annual=='avg_periods'?'selected':''}>${GS.type=='semestre'?Z('Moyenne des semestres','Average of the semesters','معدل السداسيات'):Z('Moyenne des trimestres','Average of the trimesters','معدل الثلاثيات')}</option>`:''}<option value="direct" ${GS.annual=='direct'?'selected':''}>${Z('Note annuelle saisie directement (examen annuel)','Annual grade entered directly (annual exam)','نقطة سنوية تُدخل مباشرة (امتحان سنوي)')}</option></select>`;
 h+=`<div class="sub">${Z('Notes','Scores','النقاط')}</div><div class="row2"><div>${fl('g-min',Z('Note minimum','Minimum','الحد الأدنى'),GS.min,'inputmode="decimal"')}</div><div>${fl('g-max',Z('Note maximum','Maximum','الحد الأقصى'),GS.max,'inputmode="decimal"')}</div></div>${fl('g-pass',Z('Note de passage (moyenne de passage)','Pass mark','درجة النجاح'),GS.pass,'inputmode="decimal"')}`;
 h+=`<div class="sub">${Z('Mentions (appréciations)','Mentions (appreciations)','التقديرات')}</div><div style="overflow-x:auto"><table class="mt"><tr><th>${Z('N°','No','رقم')}</th><th>${Z('De','From','من')}</th><th>${Z('À','To','إلى')}</th><th>${Z('Mention','Mention','التقدير')}</th><th></th></tr>`+GS.mentions.map((m,r)=>`<tr><td>${r+1}</td><td><input id="g-mf${r}" inputmode="decimal" style="width:68px" value="${esc(m.from)}"></td><td><input id="g-mt${r}" inputmode="decimal" style="width:68px" value="${esc(m.to)}"></td><td><input id="g-ml${r}" style="min-width:110px" value="${esc(m.label)}"></td><td><button class="x" type="button" onclick="gDelM(${r})">✕</button></td></tr>`).join('')+`</table></div><div class="row" style="margin-top:8px"><button class="btn alt small" type="button" onclick="gAddM()">+ ${Z('Mention','Mention','تقدير')}</button><button class="btn alt small" type="button" onclick="gMReset()">${Z('Recalculer selon min/max','Recalculate from min/max','إعادة الحساب')}</button></div><p class="hint">${Z('Ces plages servent au bulletin pour attribuer la mention.','These ranges decide the mention on the report card.','تُستخدم هذه النطاقات لتحديد التقدير في الكشف.')}</p>`;
 h+=`<button class="btn" type="button" onclick="gSave()">${t('save')}</button>`;f.innerHTML=h}
async function gSave(){grab();const g=GS,sp=isSP(g.type);
 if(!g.lv||!g.type)return note(Z('Choisissez le niveau et le type.','Choose the level and the type.','اختر المرحلة والنوع.'));
 const pn=new Set();
 for(let i=0;i<g.periods.length;i++){const p=g.periods[i],nn=(p.name||'').trim();
  if(sp){if(!nn)return note(Z(`Période ${i+1} : le nom est obligatoire.`,`Period ${i+1}: the name is required.`,`الفترة ${i+1}: الاسم مطلوب.`));if(pn.has(nn.toLowerCase()))return note(Z(`Nom de période en double : « ${nn} ».`,`Duplicate period name: "${nn}".`,`اسم فترة مكرر: «${nn}».`));pn.add(nn.toLowerCase())}
  p.name=nn;const ts=new Set();
  for(let j=0;j<p.tests.length;j++){const n=(p.tests[j]||'').trim();
   if(!n)return note(Z(`Le nom du test ${j+1} est vide${sp?' ('+nn+')':''}.`,`Test ${j+1} has no name${sp?' ('+nn+')':''}.`,`اسم الاختبار ${j+1} فارغ${sp?' ('+nn+')':''}.`));
   if(ts.has(n.toLowerCase()))return note(Z(`Nom en double : « ${n} »${sp?' ('+nn+')':''}.`,`Duplicate name: "${n}"${sp?' ('+nn+')':''}.`,`اسم مكرر: «${n}»${sp?' ('+nn+')':''}.`));ts.add(n.toLowerCase());p.tests[j]=n}}
 const mn=numv(g.min),mx=numv(g.max),ps=numv(g.pass);
 if(mn==null||mx==null)return note(Z('La note minimum et la note maximum sont obligatoires.','Minimum and maximum scores are required.','الحدان الأدنى والأقصى مطلوبان.'));
 if(mx<=mn)return note(Z('Le maximum doit être supérieur au minimum.','The maximum must be greater than the minimum.','يجب أن يكون الحد الأقصى أكبر من الأدنى.'));
 if(ps==null||ps<mn||ps>mx)return note(Z('La note de passage doit être comprise entre le minimum et le maximum.','The pass mark must be between the minimum and the maximum.','يجب أن تكون درجة النجاح بين الحد الأدنى والأقصى.'));
 const ms=[];for(const m of g.mentions){const l=(m.label||'').trim(),a=numv(m.from),b=numv(m.to);if(!l&&String(m.from||'').trim()===''&&String(m.to||'').trim()==='')continue;
  if(!l||a==null||b==null||a>b||a<mn||b>mx)return note(Z('Mentions : chaque ligne doit avoir De, À et Mention, avec De ≤ À, dans les limites du minimum et du maximum.','Mentions: each row needs From, To and Mention, with From ≤ To, within the minimum and maximum.','التقديرات: كل سطر يحتاج من وإلى والتقدير، مع من ≤ إلى، ضمن الحدين.'));ms.push({label:l,from:a,to:b})}
 ms.sort((a,b)=>b.from-a.from);for(let i=1;i<ms.length;i++)if(ms[i].to>=ms[i-1].from)return note(Z(`Les plages de « ${ms[i].label} » et « ${ms[i-1].label} » se chevauchent.`,`The ranges of "${ms[i].label}" and "${ms[i-1].label}" overlap.`,`نطاقا «${ms[i].label}» و«${ms[i-1].label}» متداخلان.`));if(g.annual=='avg_periods'&&!(sp&&g.periods.length>=2))g.annual='avg_all';
 const r=await run(sb.from('grading').upsert({school_id:user.sid,level_id:g.lv,type:g.type,periods:g.periods,annual:g.annual,min_score:mn,max_score:mx,pass_score:ps,mentions:ms},{onConflict:'level_id'}));
 if(!r.error){GS=null;render();note(t('saved'))}}
function gSummary(g){const sp=isSP(g.type),n=g.periods.length,u=sp?(g.type=='semestre'?Z('semestres','semesters','سداسيات'):Z('trimestres','trimesters','ثلاثيات')):(g.type=='test'?Z('tests','tests','اختبارات'):Z('évaluations','evaluations','تقويمات'));
 const head=`<b>${esc(nm(D.levels,g.level_id))}</b> : ${tlab(g.type)} · ${sp?n:g.periods[0].tests.length} ${u} · ${Z('notes de','scores from','النقاط من')} ${fmt(+g.min_score)} ${Z('à','to','إلى')} ${fmt(+g.max_score)} · ${Z('passage','pass','النجاح')} ${fmt(passOf(g))}`;

<div id="sb"><label for="pid">${Z('ID du personnel','Staff ID','رقم الموظف')}</label><select id="pid" onchange="pidCh()"><option value="">—</option>${avail.map(p=>`<option value="${p.id}">${esc(p.staff_no||'?')}</option>`).join('')}</select><label for="pnm">${Z('Nom complet','Full name','الاسم الكامل')}</label><input id="pnm" readonly></div>
<div id="tb"><div class="row" style="margin-top:8px"><select id="tl" onchange="fillC()"><option value="">${t('level')}</option>${D.levels.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select><select id="tc" onchange="fillS()"><option value="">${t('cls')}</option></select><select id="ts"><option value="">${t('subj')}</option></select></div></div>
<div id="pb" style="display:none">${fl('fn',Z('Nom complet du parent','Parent full name','الاسم الكامل لولي الأمر'),'')}${fl('mt',t('matr'),'')}</div>
${fl('us',t('uname'),'','autocapitalize="off"')}${fl('pw2',t('pw'),'')}<button class="btn" onclick="addStaff()">${t('add')}</button></div><div class="card">${D.staff.map(p=>{const pe=D.personnel.find(x=>x.id==p.personnel_id);return `<div class="li"><span><b>${esc(p.full_name||'')}</b> <span class="mu">${t('r_'+p.role)}</span><br><span class="mu">${pe?esc(pe.staff_no||'')+' · ':''}${esc(p.username||'')}@${esc(sc)}${p.student_id?' · '+esc(nm(D.students,p.student_id)):''}${p.subject_id?' · '+esc(nm(D.subjects,p.subject_id)):''}</span></span><span><button class="btn alt small" onclick="resetPw('${p.user_id}')">${t('pw')}</button><button class="x" onclick="delStaff('${p.user_id}')">✕</button></span></div>`}).join('')||`<p class="mu">${t('none')}</p>`}</div>`}
/* ---- personnel (basic HR records) ---- */
const pn0=v=>numv(v)||0;
function peCalc(){const m=Math.round(pn0($('pe-h').value)*pn0($('pe-r').value)*100)/100;$('pe-ms').value=fmt(m)+' '+(SC().currency||'')}
async function savePersonnel(){
 const ed=sel.pe?D.personnel.find(x=>x.id==sel.pe):null,sp=id=>$(id).value.trim().replace(/\s+/g,' ');
 const fn=sp('pe-fn'),ln=sp('pe-ln'),tel=cleanTel($('pe-tel').value),em=sp('pe-em'),pos=sp('pe-pos'),hs=$('pe-h').value.trim(),rs=$('pe-r').value.trim(),h=numv(hs),r=numv(rs);
 if(!ln)return note(Z('Le nom est obligatoire.','Last name is required.','اللقب مطلوب.'));
 if(!fn)return note(Z('Le prénom est obligatoire.','First name is required.','الاسم مطلوب.'));
 if(tel&&!telOk(tel))return note(Z('Contact invalide (8 à 15 chiffres).','Invalid contact (8 to 15 digits).','رقم غير صالح (8 إلى 15 رقمًا).'));
 if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return note(Z('Email invalide.','Invalid email.','بريد إلكتروني غير صالح.'));
 if(!pos)return note(Z('Le poste est obligatoire.','Position is required.','الوظيفة مطلوبة.'));
 if((hs&&(h==null||h<0))||(rs&&(r==null||r<0)))return note(Z('Heures et salaire par heure : nombres positifs.','Hours and hourly salary: positive numbers.','الساعات وأجر الساعة: أرقام موجبة.'));
 const rec={first_name:fn,last_name:ln,contact:tel,address:sp('pe-adr'),email:em,position:pos,date_hired:$('pe-dh').value||null,hours_month:h||0,rate_hour:r||0,monthly_salary:Math.round((h||0)*(r||0)*100)/100,active:$('pe-act').value=='1'};
 const {data:rd,error}=await (ed?sb.from('personnel').update(rec).eq('id',ed.id):sb.from('personnel').insert({...rec,school_id:user.sid}).select('staff_no').single());
 if(error)return note(error.message);sel.pe=null;await load();render();window.scrollTo(0,0);note(t('saved')+(rd&&rd.staff_no?' · ID '+rd.staff_no:''))}
async function delPers(id){const p=D.personnel.find(x=>x.id==id)||{};if(D.staff.some(u=>u.personnel_id==id))return note(Z('Cet employé a un compte utilisateur. Supprimez d’abord l’utilisateur.','This staff member has a user account. Delete the user first.','لهذا الموظف حساب مستخدم. احذف المستخدم أولاً.'));if(!await ask(`${t('delq')} « ${p.first_name||''} ${p.last_name||''} » ?`))return;await run(sb.from('personnel').delete().eq('id',id))}
function personnelView(){
 const ed=sel.pe?D.personnel.find(x=>x.id==sel.pe):null,P=ed||{},cur=SC().currency||'',act=D.personnel.filter(x=>x.active),tot=act.reduce((a,x)=>a+(+x.monthly_salary||0),0);
 return `<div class="card"><h2>${ed?Z('Modifier le personnel','Edit staff member','تعديل موظف'):Z('Nouveau personnel','New staff member','موظف جديد')}</h2><label>${Z('ID du personnel','Staff ID','رقم الموظف')}</label><input readonly value="${esc(ed?(P.staff_no||'—'):String(SC().next_staff_no||1).padStart(3,'0')+' ('+Z('attribué à l’enregistrement','assigned on save','يُمنح عند الحفظ')+')')}">${fl('pe-ln',Z('Nom','Last name','اللقب'),P.last_name)}${fl('pe-fn',Z('Prénom(s)','First name(s)','الاسم'),P.first_name)}${tl('pe-tel',Z('Contact','Contact','الاتصال'),P.contact)}${fl('pe-adr',Z('Adresse','Address','العنوان'),P.address)}${fl('pe-em','Email',P.email,'type="email"')}${fl('pe-pos',Z('Poste','Position','الوظيفة'),P.position)}<label for="pe-dh">${Z('Date d’embauche','Date hired','تاريخ التوظيف')}</label><input id="pe-dh" type="date" value="${esc(P.date_hired||'')}">${fl('pe-h',Z('Heures par mois','Hours per month','ساعات الشهر'),ed?dsp(P.hours_month):'','inputmode="decimal" oninput="peCalc()"')}${fl('pe-r',Z('Salaire par heure','Salary per hour','أجر الساعة')+(cur?' ('+esc(cur)+')':''),ed?dsp(P.rate_hour):'','inputmode="decimal" oninput="peCalc()"')}<label for="pe-ms">${Z('Salaire mensuel (calculé)','Monthly salary (calculated)','الراتب الشهري (محسوب)')}</label><input id="pe-ms" readonly value="${fmt(+P.monthly_salary||0)} ${esc(cur)}"><label for="pe-act">${Z('Actif','Active','نشط')}</label><select id="pe-act"><option value="1" ${P.active!==false?'selected':''}>${t('yes')}</option><option value="0" ${P.active===false?'selected':''}>${t('no')}</option></select><div class="row2">${ed?`<button class="btn alt" onclick="sel.pe=null;render()">${Z('Annuler','Cancel','إلغاء')}</button>`:'<span></span>'}<button class="btn" onclick="savePersonnel()">${t('save')}</button></div></div>
<div class="card"><h2>${t('personnels')} (${D.personnel.length})</h2>${act.length?`<p class="hint" style="margin-top:0">${Z('Masse salariale mensuelle (actifs)','Monthly payroll (active)','إجمالي الرواتب الشهرية (النشطون)')} : <b>${fmt(tot)} ${esc(cur)}</b></p>`:''}${D.personnel.map(x=>`<div class="item"><span class="no">${esc(x.staff_no||'—')}</span><div class="tx">${esc(x.last_name)} ${esc(x.first_name)}<span class="tag ${x.active?'on':'off'}">${x.active?Z('Actif','Active','نشط'):Z('Inactif','Inactive','غير نشط')}</span><small>${esc(x.position||'')}${x.contact?' · '+esc(x.contact):''} · ${fmt(+x.monthly_salary||0)} ${esc(cur)}</small></div><div class="btns"><button class="btn alt small" onclick="sel.pe='${x.id}';render();window.scrollTo(0,0)">${Z('Modifier','Edit','تعديل')}</button><button class="x" onclick="delPers('${x.id}')">✕</button></div></div>`).join('')||`<p class="mu">${t('none')}</p>`}</div>`}
/* ---- grades & report ---- */
/* ---- grades & report ---- */
const lvlOfClass=cid=>(D.classes.find(c=>c.id==cid)||{}).level_id;
const gOf=cid=>D.grading.find(g=>g.level_id==lvlOfClass(cid));
const pp=()=>sel.p==null?1:sel.p,kk=()=>sel.k==null?1:sel.k;
function eff(g){return isSP(g.type)?(sel.p===0?[0,0]:[pp(),kk()]):(sel.k===0?[0,0]:[1,kk()])}
function pickP(v){sel.p=v;sel.k=1;render()}
function chk(el,mn,mx){const v=el.value;if(v!==''){const n=numv(v);if(!/^-?[0-9]*[.,]?[0-9]*$/.test(v)||(n!=null&&(n>mx||n<mn))){el.classList.add('bad');el.value=el.dataset.old||'';setTimeout(()=>el.classList.remove('bad'),700);return}}el.dataset.old=el.value}
async function setGrade(e,s,v,tm,ts,mn,mx){const k=`${e}_${s}_${tm}_${ts}`,n=numv(v);
 if(String(v).trim()===''||n==null){delete G[k];await sb.from('grades').delete().eq('student_id',e).eq('subject_id',s).eq('term',tm).eq('test',ts);return}
 const z=Math.max(mn,Math.min(mx,n));G[k]=z;const {error}=await sb.from('grades').upsert({school_id:user.sid,student_id:e,subject_id:s,term:tm,test:ts,value:z},{onConflict:'student_id,subject_id,term,test'});if(error)note(error.message)}
const mean=a=>{a=a.filter(z=>z!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
function notesView(){
 const C=D.classes.map(cl),S=D.subjects.filter(x=>x.class_id==sel.c),E=D.students.filter(x=>x.class_id==sel.c),sn=s=>s.nom?s.nom+' '+(s.prenom||''):s.name,Ex=E.map(s=>({id:s.id,name:sn(s)}));
 const g=sel.c?gOf(sel.c):null,noG=sel.c&&!g?`<p class="err">${Z('Configurez d’abord la structure des notes de ce niveau (Les notes › Structure des notes).','First set up the grading structure for this level (Grades › Grading structure).','اضبط أولاً هيكل النقاط لهذه المرحلة (النقاط › هيكل النقاط).')}</p>`:'';
 const annL=Z('Annuelle','Annual','سنوية');
 if(tab=='grades'){
  let h=`<div class="card">`+(user.role=='teacher'?`<p><b>${esc(nm(C,sel.c))}</b> — ${esc(nm(S,sel.s))}</p>`:`<div class="row"><select onchange="sel.s=null;sel.p=null;sel.k=null;pick('c',this.value)">${opts(C,sel.c)}</select><select onchange="pick('s',this.value)">${opts(S,sel.s)}</select></div>`)+noG;
  if(g){const sp=isSP(g.type),annOnly=sp&&sel.p===0;
   h+=`<div class="row">`+(sp?`<select onchange="pickP(+this.value)">${g.periods.map((p,i)=>`<option value="${i+1}" ${pp()==i+1?'selected':''}>${esc(p.name)}</option>`).join('')}${g.annual=='direct'?`<option value="0" ${sel.p===0?'selected':''}>${annL}</option>`:''}</select>`:'')+
   (annOnly?'':`<select onchange="pick('k',+this.value)">${g.periods[sp?Math.min(pp(),g.periods.length)-1:0].tests.map((n,j)=>`<option value="${j+1}" ${kk()==j+1?'selected':''}>${esc(n)}</option>`).join('')}${!sp&&g.annual=='direct'?`<option value="0" ${sel.k===0?'selected':''}>${annL}</option>`:''}</select>`)+`</div>`;
   if(sel.s){const [tm,ts]=eff(g),mn=+g.min_score,mx=+g.max_score;
    h+=`<p class="hint">${fmt(mn)} – ${fmt(mx)}</p>`+(E.map(e=>{const val=G[`${e.id}_${sel.s}_${tm}_${ts}`],vs=val==null?'':String(val).replace('.',lang=='en'?'.':',');return `<div class="li"><span>${esc(sn(e))}</span><input type="text" inputmode="decimal" style="width:90px;flex:none" oninput="chk(this,${mn},${mx})" data-old="${vs}" value="${vs}" onchange="setGrade('${e.id}','${sel.s}',this.value,${tm},${ts},${mn},${mx})"></div>`}).join('')||`<p class="mu">${t('none')}</p>`)}}
  return h+`</div>`}
 let r='';
 if(sel.e&&g){const sp=isSP(g.type),mn=+g.min_score,mx=+g.max_score,cols=sp?g.periods.map(p=>p.name):g.periods[0].tests;
  const rows=S.map(s=>{const per=g.periods.map((p,i)=>p.tests.map((_,j)=>G[`${sel.e}_${s.id}_${i+1}_${j+1}`])),pa=per.map(mean);
   const an=g.annual=='avg_all'?mean([].concat(...per)):g.annual=='avg_periods'?mean(pa):(G[`${sel.e}_${s.id}_0_0`]==null?null:G[`${sel.e}_${s.id}_0_0`]);
   return {s,cells:sp?pa:per[0],an}});
  const wavg=f=>{let a=0,b=0;rows.forEach(x=>{const v=f(x);if(v!=null){a+=v*x.s.coef;b+=+x.s.coef}});return b?a/b:null};
  const gen=wavg(x=>x.an),mm=gen==null?[]:mentRows(g).filter(m=>gen>=m.from-1e-9).sort((a,b)=>b.from-a.from),mention=mm.length?mm[0].label:'';
  r=`<div class="card"><h3>${esc(user.name)}</h3><p>${esc(nm(Ex,sel.e))} — ${esc(nm(C,sel.c))}</p><div style="overflow-x:auto"><table><tr><th>${t('subj')}</th><th>${t('coef')}</th>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th>${annL}</th></tr>${rows.map(x=>`<tr><td>${esc(x.s.name)}</td><td>${x.s.coef}</td>${x.cells.map(v=>`<td>${fmt(v)}</td>`).join('')}<td><b>${fmt(x.an)}</b></td></tr>`).join('')}<tr><th colspan="2">${t('avg')}</th>${cols.map((_,c)=>`<th>${fmt(wavg(x=>x.cells[c]))}</th>`).join('')}<th>${fmt(gen)}</th></tr></table></div><h3>${t('avg')}: ${fmt(gen)} / ${fmt(mx)}${gen!=null?` — ${gen>=passOf(g)?t('passed'):t('failed')}`:''}</h3>${mention?`<p><b>${esc(mention)}</b></p>`:''}<button class="btn noprint" onclick="window.print()">${t('print')}</button></div>`}
 return (user.role=='parent'?'':`<div class="card noprint"><div class="row"><select onchange="sel.e=null;pick('c',this.value)">${opts(C,sel.c)}</select><select onchange="pick('e',this.value)">${opts(Ex,sel.e)}</select></div>${noG}</div>`)+r}
/* ---- render ---- */
function view(){
 if(user.admin)return schoolsView();
 return ({home:homeView,levels:levelsView,classes:classesView,subjects:subjectsView,students:studentsView,users:staffView,personnels:personnelView,settings:settingsView,grades:notesView,report:notesView}[tab]||(()=>`<div class="card">${t('soon')}</div>`))()}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';$('lg').value=lang;
 $('hn').textContent=(user&&user.name)||'Gandal Écoles';
 $('who').innerHTML=user?`<button class="x" style="color:#fff" onclick="logout()">${t('out')}</button>`:'';
 const nav=$('nav');closeSheet();
 if(!user){nav.style.display='none';$('app').innerHTML=`<div class="card"><h2>${t('login')}</h2><div class="row"><input id="i" placeholder="${t('id')}" autocapitalize="off"></div><div class="row"><input id="p" type="password" placeholder="${t('pw')}"></div><button class="btn" onclick="login()">${t('go')}</button><p class="err">${err}</p><p class="mu">${t('hint')}</p></div>`;return}
 const m=user.role=='school_admin'?['home','add','notes','fin','gen','tab']:user.role=='it'?['add']:[];
 nav.innerHTML=m.map(k=>`<button class="${(k=='home'?tab=='home':MENUS[k].includes(tab))?'active':''}" onclick="${k=='home'?"go('home')":`openSheet('${k}')`}"><span class="ic">${k=='home'?'🏠':MIC[k]}</span>${k=='home'?Z('Accueil','Home','الرئيسية'):mname(k)}</button>`).join('');
 nav.style.display=m.length?'flex':'none';document.body.style.paddingBottom=m.length?'66px':'0';
 $('app').innerHTML=view();
 if(tab=='students')bindStudents();else if(tab=='settings')bindGrading()}
render();boot();
</script>
